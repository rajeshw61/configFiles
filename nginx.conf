# =========================================================================
# Hardened Nginx Production SPA Configuration — OpsHardener.dev
# 100% Client-Side Static Serving (Zero Backend, Zero Proxying)
# Target Port: 8080 (Non-Root Unprivileged Runtime)
# =========================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable server version disclosure
    server_tokens off;

    # Client Request Safety Limits
    client_max_body_size 1m;
    keepalive_timeout 65;

    # Gzip Compression for static text assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Container Health Check Endpoint (Exact match, returns 200 OK without logging)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Static Favicon and Robots.txt (Exact matches, served directly without SPA fallback)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        log_not_found off;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static Assets with Content Hashes (Cache for 1 Year, Immutable)
    # Explicitly declared in location to guarantee inheritance under Nginx add_header rules
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection "0" always;
        try_files $uri =404;
    }

    # Single-Page Application (SPA) Client-Side Route Fallback
    # All route paths fall back to index.html with no-cache revalidation
    # Security headers explicitly maintained on the fallback location block
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
