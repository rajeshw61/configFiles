
#user nobody;
worker_processes 1;
#error_log logs/error.log;
#error_log logs/error.log notice;
#error_log logs/error.log info;
#pid logs/nginx.pid;
events {
  worker_connections 1024;
}
http {
    client_max_body_size 100M;
    server {
      client_max_body_size 100M;
    listen 9999;
    server_name localhost; # Change to your domain or server IP
    location /rest/authorization/ {
      auth_basic "Restricted Access";
      auth_basic_user_file <Location of user.htpasswd file>;
      proxy_pass http://<Url of host of Studio service>:<port number>/mobius/rest/authorization;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Remote-User $remote_user;
      client_max_body_size 100M;
    }

    location /mobius/ {
      auth_basic "Restricted Access";
      auth_basic_user_file <Location of user.htpasswd file>;
      proxy_pass http://<Url of Tomcat server instance used for mobius>:<port number>;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Remote-User $remote_user;
      client_max_body_size 100M;
    }

    location = /contentautomation/ {
		auth_basic "Restricted Access";
		auth_basic_user_file C:\projects\user.htpasswd;
		client_max_body_size 100M;
		# Set default return_url
		set $return_url "$scheme://$host/contentautomation/index.html";

		# If port matches regex, set return_url with port
		if ($server_port ~ "^[0-9]+$") {
		  set $return_url   "$scheme://$host:$server_port/contentautomation/index.html";
			}
			
			return 301 $return_url;

    location /contentautomation/ {
      auth_basic "Restricted Access";
      auth_basic_user_file <Location of user.htpasswd file>;
      proxy_pass http://<Url of Tomcat server instance used for appmanager>:<port number>; 
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Remote-User $remote_user;
      client_max_body_size 100M;
    }

    location /appmanager/ {
      auth_basic "Restricted Access";
      auth_basic_user_file <Location of user.htpasswd file>;
      proxy_pass http://<Url of Tomcat server instance used for appmanager>:<port number>; 
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Remote-User $remote_user;
      client_max_body_size 100M;
    }

    location /process/ {
      auth_basic "Restricted Access";
      auth_basic_user_file <Location of user.htpasswd file>;
      proxy_pass http://<Url of Tomcat server instance used for mobius>:<port number>;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Remote-User $remote_user;
      client_max_body_size 100M;
    }

    location /processengine/ {
      auth_basic "Restricted Access";
      auth_basic "Restricted Access";
      auth_basic_user_file <Location of user.htpasswd file>;
      proxy_pass http://<Url of Tomcat server instance used for mobius>:<port number>;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Remote-User $remote_user;
      client_max_body_size 100M;
    }

    location /studio/ {
      auth_basic "Restricted Access";
      auth_basic "Restricted Access";
      auth_basic_user_file <Location of user.htpasswd file>;
      proxy_pass http://<Url of Tomcat server instance used for mobius>:<port number>;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Remote-User $remote_user;
      proxy_read_timeout 300; # Increase to 5 minutes
      proxy_connect_timeout 300; 
    client_max_body_size 100M;
    }
  }
}